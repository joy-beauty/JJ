<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderneta de Vendas</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>


:root{
  --bg:#f6f4f7; --surface:#ffffff; --surface2:#efebf1; --fg:#26202b; --muted:#6d6475; --line:#e2dce7;
  --accent:#b3124f; --accent-fg:#ffffff; --accent-soft:#f8dde8; --mid:#a79cb0;
  --ok:#1c7a5a; --ok-soft:#d9f0e6; --warn:#9a5b00; --warn-soft:#fbebcf; --bad:#b42318; --bad-soft:#fbdcd8;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(38,32,43,.06),0 8px 24px rgba(38,32,43,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#19151c; --surface:#231e27; --surface2:#2d2732; --fg:#f1ecf4; --muted:#a79db0; --line:#3a3341;
  --accent:#f0699b; --accent-fg:#2a0a17; --accent-soft:#4a1b30; --mid:#7f748b;
  --ok:#5fd3a2; --ok-soft:#17382c; --warn:#f0b45a; --warn-soft:#3d2e12; --bad:#ff8a7d; --bad-soft:#45201c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#19151c; --surface:#231e27; --surface2:#2d2732; --fg:#f1ecf4; --muted:#a79db0; --line:#3a3341;
  --accent:#f0699b; --accent-fg:#2a0a17; --accent-soft:#4a1b30; --mid:#7f748b;
  --ok:#5fd3a2; --ok-soft:#17382c; --warn:#f0b45a; --warn-soft:#3d2e12; --bad:#ff8a7d; --bad-soft:#45201c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700;margin-bottom:2px}
.sub,.muted{color:var(--muted);font-size:13px}
.sub{margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip-bal{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;text-align:right;line-height:1.15}
.chip-bal span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip-bal b{font-size:16px}
section{margin-bottom:26px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .l{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.tile .n{font-size:12.5px;color:var(--muted)}
.tile.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tile.hot .l,.tile.hot .n{color:inherit;opacity:.85}
.tile.bad .v{color:var(--bad)} .tile.ok .v{color:var(--ok)}

.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);gap:2px;margin:14px 0 8px}
.bar i{display:block;min-width:4px}
.bar .a{background:var(--ok)} .bar .b{background:var(--warn)} .bar .c{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg)} .legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;text-decoration:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ln,.due{display:flex;align-items:baseline;gap:0;padding:3px 0}
.ln span,.due span{min-width:0;overflow-wrap:anywhere}
.lead{flex:1;border-bottom:2px dotted var(--line);margin:0 8px 4px;min-width:12px}
.list{display:grid;gap:10px}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;padding:11px 16px;min-height:44px}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}

.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:9px 12px}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{color:var(--fg);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:grid;gap:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.prod .im{aspect-ratio:1/1;width:100%;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-size:42px;color:var(--accent);overflow:hidden}
.prod .im img{width:100%;height:100%;object-fit:cover;display:block}
.prod .bd{padding:10px 12px 12px;display:grid;gap:4px}
.prod .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.prod .pr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.prod .pr b{color:var(--fg)}

.sale{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px}
.sale.ok{border-left-color:var(--ok)} .sale.warn{border-left-color:var(--warn)} .sale.bad{border-left-color:var(--bad)}
.sale-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.who{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.sale-f{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:8px}
.tot{font-family:var(--display);font-size:22px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.cust{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cust>button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;width:100%;cursor:pointer}
.cust>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cust .in{padding:0 12px 12px;display:grid;gap:10px}
.owe{font-family:var(--display);font-size:20px;font-weight:700;text-align:right}

.bal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.bal .big{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mv{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.mv:last-child{border-bottom:0}
.mv .d{width:48px;flex:none;color:var(--muted);font-size:13px}
.mv .t{flex:1;min-width:0;overflow-wrap:anywhere}
.mv .x{font-size:12px;color:var(--muted);background:none;border:0;padding:4px}
.pos{color:var(--ok);font-weight:600} .neg{color:var(--bad);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav button{background:none;border:0;border-radius:10px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:48px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow);border-radius:999px;padding:0 20px;min-height:50px;font-size:16px}

[hidden]{display:none!important}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(20,12,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h3{font-size:21px}
.x-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:20px;line-height:1}
.photo{display:grid;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px}.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px}.photo:has(img){grid-template-columns:auto 1fr}.photo label{grid-column:1/-1;text-align:center;cursor:pointer}.photo .dis{opacity:.6;pointer-events:none}.line.chk{border-color:#d9822b}.flag{font-size:12px;font-weight:600;color:#b45309}
.line{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.line .g{display:grid;grid-template-columns:90px 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg label{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg input:checked+span{display:block;background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15);border-radius:9px;margin:-9px -6px;padding:9px 6px}
.seg label{position:relative}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.sum{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum div{display:flex;justify-content:space-between}
.warn-t{color:var(--warn);font-size:13px}.err-t{color:var(--bad);font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}

nav .in{grid-template-columns:repeat(6,1fr)!important}
nav button{font-size:11px!important}
.share{display:grid;gap:10px;margin-bottom:14px}
.price{font-family:var(--display);font-size:20px;font-weight:700;color:var(--accent)}
.hero{margin-bottom:16px}.hero small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:32px;line-height:1.05;margin:2px 0 6px}.hero p{margin:0}
body.client nav,body.client .fab{display:none}
body.client{padding-block-end:32px}
.mplot{position:relative;height:222px;margin-top:6px}
.mplot .g{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);pointer-events:none}
.mplot .g span{position:absolute;left:0;top:-15px;background:var(--bg);padding-right:4px}
.mchart{position:absolute;inset:0;display:flex;gap:4px;overflow-x:auto}
.mcol{all:unset;box-sizing:border-box;flex:1 0 64px;display:flex;flex-direction:column;cursor:pointer;border-radius:10px;height:100%}
.mcol[aria-pressed="true"]{background:var(--surface2)}
.mcol:focus-visible{outline:2px solid var(--accent)}
.mcol .bars{height:160px;margin-top:12px;display:flex;align-items:flex-end;gap:3px;padding:0 8px}
.mcol .bars i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.bars .bv{background:var(--accent)}.bars .bc{background:var(--mid)}.bars .bl{background:var(--ok)}
.mcol .ml{text-align:center;font-size:12px;margin-top:6px;font-weight:600}
.mcol .mp{text-align:center;font-size:11px;color:var(--muted)}
.rk{display:grid;gap:12px}.rk .r{display:grid;gap:4px}
.rk .t{display:flex;justify-content:space-between;gap:10px}.rk .t>span:first-child{min-width:0;overflow-wrap:anywhere}
.rk .tr{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.rk .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.dn{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dw{position:relative;width:132px;height:132px;flex:none}.dw svg{width:100%;height:100%;display:block}
.dw>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ins li{padding-left:18px;position:relative}.ins li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.prog{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:6px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four span{padding:9px 2px;font-size:13px}
.dre .rw{display:grid;grid-template-columns:minmax(0,1fr) auto 74px;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.dre .rw>span:first-child{overflow-wrap:anywhere}
.dre .rw.h{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:0}
.dre .rw.st{font-weight:700;background:var(--surface2);margin:0 -14px;padding:9px 14px;border-bottom:0}
.dre .rw.in>span:first-child{padding-left:12px;color:var(--muted)}
.dre .rw>span:nth-child(2){text-align:right}
.dre .pp{text-align:right;color:var(--muted);font-size:13px;font-weight:500}
.dre .pp small{display:block;font-size:11px}
.dre .rw:last-child{border-bottom:0}
.tw{overflow-x:auto}
.mt{border-collapse:collapse;min-width:100%;font-size:13px}
.mt th,.mt td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.mt th:first-child,.mt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.mt tr.st td{font-weight:700}
.mt th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.mt tr.pcr td{color:var(--muted)}
.ln.hl>span:first-child,.ln.hl>b{font-weight:700;color:var(--accent)}
.sf-row{display:grid;grid-template-columns:44px minmax(0,1fr) 76px 40px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sf-im{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-family:var(--display);font-size:18px}
.sf-im img{width:100%;height:100%;object-fit:cover;display:block}
.sf-row .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.sf-row input{min-height:44px;text-align:center;padding:6px}
.sf-row .ok-b{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:44px;color:var(--ok);font-size:18px}
.sf-foot{position:sticky;bottom:0;background:var(--bg);margin:10px -16px 0;padding:12px 16px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
@media (min-width:700px){#sheet{align-items:center}.sheet{border-radius:20px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}

html,body{margin:0}
body.locked nav,body.locked .fab,body.locked #app{display:none}
.login{max-width:380px;margin:10vh auto 0;display:grid;gap:14px}
.login h1{font-size:30px;line-height:1.05}
.login .brand-s{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

</style>
</head>

</div></nav>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
const IMGDIR = '../img/';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; let t = String(v == null ? '' : v).replace(/[^\d.,-]/g, ''); if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const x = parseFloat(t); return isNaN(x) ? 0 : x; };
const r2 = x => Math.round(x * 100) / 100;
const fld = n => r2(n).toFixed(2).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
const fd = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4) : '';
const fds = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

let db = null;
const S = {products: [], sales: [], wallet: [], catalog: [], loaded: {}, tab: 'resumo', filter: 'todas', q: '', cq: '', brand: '', open: {}, err: '', dp: '6m', dm: '', rm: 'rev', fb: '', fp: '', fv: '', preview: false};
const SNAP = {items: [], date: ''};
let F = null;
let SAMPLE = null, photoBusy = false;
const ERRPH = {not_granted: 'Você não autorizou o uso do Claude.', rate_limited: 'Muitas tentativas. Aguarde um pouco.', image_rejected: 'Não consegui ler essa imagem. Tente outra foto.', invalid_json: 'Não consegui interpretar a foto. Tente de novo.', upstream_error: 'Erro ao analisar. Tente de novo.'};
function shrink(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image();
  im.onload = () => { const m = 1600, k = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.85); };
  im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u; }); }
async function photoToSale(file) {
  const blob = await shrink(file);
  const cat = S.products.map(p => ({id: p.id, nome: p.name, marca: p.brand || '', preco: p.price, estoque: p.stock || 0}));
  const prompt = 'Esta foto mostra produtos de cosméticos vendidos a um cliente. Identifique cada produto visível e a quantidade de cada um. ' +
    'Use SOMENTE produtos deste catálogo (campo id): ' + JSON.stringify(cat) + '\n' +
    'Se houver um nome de cliente escrito na foto, informe. Se não tiver certeza de um item, inclua mesmo assim com "certeza": false. ' +
    'Itens que não estão no catálogo vão em "desconhecidos" (descrição curta). ' +
    'Responda APENAS JSON: {"cliente": string|null, "itens": [{"id": string, "qtd": number, "certeza": boolean}], "desconhecidos": [string]}';
  const r = await SAMPLE.json(prompt, {images: [blob], cache: false});
  const url = URL.createObjectURL(blob);
  const seen = {}, lines = [];
  (r.itens || []).forEach(it => { const p = S.products.find(x => x.id === String(it.id)); if (!p) return; const q = Math.max(1, Math.round(+it.qtd || 1));
    if (seen[p.id] != null) { lines[seen[p.id]].qty += q; return; } seen[p.id] = lines.length;
    lines.push({pid: p.id, qty: q, price: fld(p.price), check: it.certeza === false || q > (p.stock || 0)}); });
  return {customer: r.cliente || '', lines, unknown: (r.desconhecidos || []).filter(Boolean), url};
}

/* ---------- derived numbers ---------- */
const initOf = p => p.initial != null ? p.initial : (p.stock || 0);
// quanto já foi investido no produto (soma de todas as compras); não muda quando o custo médio muda
const spentOf = p => p.spent != null ? p.spent : num(p.cost) * initOf(p);
const late = s => !s.paid && s.dueDate && s.dueDate < today();
const val = s => (s.paid && s.received != null) ? s.received : s.total;
function status(s) {
  if (s.paid) return {k: 'ok', t: 'Pago' + (s.paidDate ? ' em ' + fds(s.paidDate) : '')};
  if (s.dueDate) {
    const d = diff(today(), s.dueDate);
    if (d > 0) return {k: 'bad', t: 'Atrasado ' + d + (d > 1 ? ' dias' : ' dia')};
    if (d === 0) return {k: 'warn', t: 'Vence hoje'};
    return {k: 'warn', t: 'Vence ' + fds(s.dueDate)};
  }
  return {k: 'warn', t: 'A receber'};
}
function calc() {
  const c = {lotCost: 0, lotRev: 0, stCost: 0, stRev: 0, units: 0, stUnits: 0, sold: 0, paid: 0, pend: 0, late: 0, soldCost: 0, inn: 0, out: 0, aporte: 0};
  S.products.forEach(p => { const i = initOf(p), st = p.stock || 0; c.lotCost += spentOf(p); c.lotRev += p.price * i; c.stCost += p.cost * st; c.stRev += p.price * st; c.units += i; c.stUnits += st; });
  S.sales.forEach(s => { c.sold += val(s); c.soldCost += s.costTotal; if (s.paid) c.paid += val(s); else { c.pend += s.total; if (late(s)) c.late += s.total; } });
  S.wallet.forEach(w => { if (w.type === 'entrada') c.aporte += w.amount; else c.out += w.amount; });
  c.profit = c.sold - c.soldCost;
  c.balance = c.paid + c.aporte - c.out;
  return c;
}
const prodSort = (a, b) => (a.n || 0) - (b.n || 0) || (a.name || '').localeCompare(b.name || '');

/* ---------- small view helpers ---------- */
const tile = (l, v, n, cls = '') => `<div class="tile ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n || ''}</div></div>`;
const empty = t => `<div class="empty">${t}</div>`;
function pimg(p) { const im = String(p.img || ''), src = /^https?:/.test(im) ? im : (im ? IMGDIR + im + '.jpg' : ''); return src ? `<img src="${src}" alt="">` : esc((p.name || '?').trim().charAt(0).toUpperCase()); }
function stockPill(p) { const s = p.stock || 0; return s <= 0 ? '<span class="pill bad">Esgotado</span>' : `<span class="pill ${s <= 1 ? 'warn' : ''}">${s} em estoque</span>`; }

function saleCard(s, o = {}) {
  const st = status(s);
  const items = (s.items || []).map(i => `<div class="ln${o.hl && i.pid === o.hl ? ' hl' : ''}"><span>${i.qty}× ${esc(i.name)}</span><i class="lead"></i><b>${brl(i.qty * i.price)}</b></div>`).join('');
  return `<article class="sale ${st.k}">
    <div class="sale-h"><div><div class="who">${o.hideName ? fd(s.date) : esc(s.customer)}</div><div class="muted">${o.hideName ? '' : fd(s.date)}${s.note ? (o.hideName ? '' : ' · ') + esc(s.note) : ''}</div></div><span class="pill ${st.k}">${st.t}</span></div>
    ${items}
    <div class="sale-f"><div><div class="tot">${brl(val(s))}</div><div class="muted">lucro ${brl(val(s) - s.costTotal)}${s.paid && s.received != null && r2(s.received) !== r2(s.total) ? ' · cobrado ' + brl(s.total) : ''}</div></div>
    <div class="acts">${s.paid ? `<button class="btn ghost sm" data-act="unpay" data-id="${s.id}">Desfazer pagamento</button>` : `<button class="btn sm" data-act="pay" data-id="${s.id}">Marcar como pago</button>`}<button class="btn ghost sm" data-act="edit-sale" data-id="${s.id}">Editar</button></div></div>
  </article>`;
}

/* ---------- views ---------- */
function vResumo() {
  const c = calc();
  const tot = (c.paid + c.pend + c.stRev) || 1;
  const seg = (v, k) => v > 0 ? `<i class="${k}" style="flex:${v}"></i>` : '';
  const due = S.sales.filter(s => !s.paid).sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999')).slice(0, 6);
  return `
  <section><h2>O lote inteiro</h2><p class="sub">${c.units} unidades compradas, vendidas pelo preço do catálogo.</p>
    <div class="tiles">${tile('Custo total', brl(c.lotCost), 'o que você pagou')}${tile('Receita possível', brl(c.lotRev), 'se vender tudo')}${tile('Lucro possível', brl(c.lotRev - c.lotCost), c.lotCost ? Math.round((c.lotRev - c.lotCost) / c.lotCost * 100) + '% sobre o custo' : '', 'hot')}</div></section>
  <section><h2>Como está hoje</h2><p class="sub">Vendas lançadas até agora e o que ainda está no estoque.</p>
    <div class="tiles">${tile('Vendido', brl(c.sold), 'lucro ' + brl(c.profit))}${tile('Já recebido', brl(c.paid), '', 'ok')}${tile('A receber', brl(c.pend), c.late ? brl(c.late) + ' em atraso' : 'nada em atraso', c.late ? 'bad' : '')}${tile('No estoque', brl(c.stRev), c.stUnits + ' un · custo ' + brl(c.stCost))}</div>
    <div class="bar" role="img" aria-label="Divisão da receita entre recebido, a receber e estoque">${seg(c.paid, 'a')}${seg(c.pend, 'b')}${seg(c.stRev, 'c')}</div>
    <div class="legend"><span><s style="background:var(--ok)"></s>Recebido <b>${brl(c.paid)}</b></span><span><s style="background:var(--warn)"></s>A receber <b>${brl(c.pend)}</b></span><span><s style="background:var(--accent)"></s>No estoque <b>${brl(c.stRev)}</b></span></div></section>
  <section><h2>Próximos recebimentos</h2><p class="sub">Vendas ainda não pagas, da mais urgente para a mais distante.</p>
    ${due.length ? `<div class="card">${due.map(s => { const st = status(s); return `<div class="due"><span>${esc(s.customer)} <span class="pill ${st.k}">${st.t}</span></span><i class="lead"></i><b>${brl(s.total)}</b></div>`; }).join('')}</div>` : empty('Nenhum valor pendente. Quando vender fiado, os vencimentos aparecem aqui.')}</section>`;
}

  const q = S.q.trim().toLowerCase();

    `<div class="cat">${list.map(p => `<button class="prod" data-act="edit-prod" data-id="${p.id}"><div class="im">${pimg(p)}</div><div class="bd"><div class="nm">${esc(p.name)}</div><div class="muted">${esc(p.brand || '')}</div>
      <div class="pr"><span>Custo</span><b>${brl(p.cost)}</b></div><div class="pr"><span>Venda</span><b>${brl(p.price)}</b></div><div class="pr"><span>Lucro</span><b>${brl(p.price - p.cost)}</b></div><div class="row" style="justify-content:space-between">${stockPill(p)}<span class="pill" style="background:var(--accent-soft);color:var(--accent)">✎ Editar</span></div></div></button>`).join('')}</div>`;

function vendasProd() {
  const p = S.products.find(x => x.id === S.fv); if (!p) return '';
  let sold = 0, rev = 0; S.sales.forEach(s => (s.items || []).forEach(i => { if (i.pid === p.id) { sold += i.qty; rev += i.qty * i.price; } }));
  const ini = initOf(p), adj = p.adj || 0, exp = ini - sold + adj, st = p.stock || 0, d = st - exp;
  return `<div class="card" style="margin-bottom:12px"><div class="row sb"><b>${esc(p.name)}</b>${stockPill(p)}</div>
    <div class="ln"><span>Comprado</span><i class="lead"></i><b>${ini} un</b></div>
    <div class="ln"><span>Vendido</span><i class="lead"></i><b>${sold} un · ${brl(rev)}</b></div>
    ${adj ? `<div class="ln"><span>Ajustes de conferência</span><i class="lead"></i><b>${adj > 0 ? '+' : '−'}${Math.abs(adj)} un</b></div>` : ''}
    <div class="ln"><span>Deveria ter em estoque</span><i class="lead"></i><b>${exp} un</b></div>
    <div class="ln"><span>Estoque no sistema</span><i class="lead"></i><b>${st} un</b></div>
    ${d !== 0 ? `<div class="warn-t" style="margin-top:6px">O estoque está ${Math.abs(d)} un ${d > 0 ? 'acima' : 'abaixo'} de compras menos vendas. Confira na prateleira.</div>` : `<div class="muted" style="margin-top:6px">Compras menos vendas bate com o estoque.${p.lastCheck ? ' Última conferência em ' + fd(p.lastCheck) + '.' : ''}</div>`}
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="edit-prod" data-id="${p.id}">Editar produto</button></div></div>`;
}
function vVendas() {
  const f = S.filter, hasP = s => !S.fv || (s.items || []).some(i => i.pid === S.fv), base = S.sales.filter(hasP);
  const cnt = {todas: base.length, receber: base.filter(s => !s.paid).length, atrasadas: base.filter(late).length, pagas: base.filter(s => s.paid).length};

    ${vendasProd()}<div class="chips">${chip('todas', 'Todas')}${chip('receber', 'A receber')}${chip('atrasadas', 'Atrasadas')}${chip('pagas', 'Pagas')}</div>

}

/* ---------- conferência de estoque ---------- */
function stockRows() { return S.products.slice().sort(prodSort); }
function stRes(p) {
  const raw = F.counts[p.id]; if (raw === '' || raw == null) return {k: '', t: ''};
  const c = Math.max(0, Math.floor(num(raw))), d = c - (p.stock || 0);
  return d === 0 ? {k: 'ok', t: 'Confere'} : d < 0 ? {k: 'bad', t: 'Faltam ' + (-d)} : {k: 'warn', t: 'Sobram ' + d};
}
function updStock() {
  let n = 0, dif = 0;
  stockRows().forEach(p => { const r = stRes(p), el = $('#st-' + p.id); if (el) el.innerHTML = r.t ? `<span class="pill ${r.k}">${r.t}</span>` : ''; if (r.t) { n++; if (r.k !== 'ok') dif++; } });
  const s = $('#ssum'), b = $('#sbtn');
  if (s) s.textContent = n ? `${n} conferidos · ${dif} com diferença` : 'Digite a quantidade que você contou.';
  if (b) { b.disabled = !n; b.textContent = dif ? `Salvar e ajustar ${dif} ${dif > 1 ? 'produtos' : 'produto'}` : 'Salvar conferência'; }
}
function openStock() {
  F = {kind: 'stock', counts: {}};
  openSheet(`${head('Conferir estoque')}<p class="muted" style="margin:0 0 6px">Conte o que tem em mãos e digite ao lado. Toque em ✓ quando a contagem bater com o sistema. Produto em branco fica como está.</p>
    <div class="row" style="margin-bottom:4px"><button class="btn ghost sm" data-act="stock-fill">Preencher tudo com o sistema</button><button class="btn ghost sm" data-act="stock-clear">Limpar</button></div>
    ${stockRows().map(p => `<div class="sf-row"><div class="sf-im">${pimg(p)}</div><div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="muted">Sistema: <b>${p.stock || 0}</b>${p.lastCheck ? ' · conferido ' + fds(p.lastCheck) : ''}</div><div id="st-${p.id}"></div></div>
      <input type="number" inputmode="numeric" min="0" id="sc-${p.id}" data-sc="${p.id}" aria-label="Quantidade contada de ${esc(p.name)}" placeholder="?"><button class="ok-b" data-act="stock-ok" data-id="${p.id}" aria-label="Confere: ${esc(p.name)}">✓</button></div>`).join('')}
    <div class="sf-foot"><div class="muted" id="ssum" style="text-align:center"></div><button class="btn" id="sbtn" data-act="save-stock" disabled>Salvar conferência</button></div>`);
  updStock();
}
async function saveStock(btn) {
  const rows = stockRows().filter(p => stRes(p).t); if (!rows.length) return;
  await run(btn, async () => {
    let adj = 0;
    for (const p of rows) {
      const c = Math.max(0, Math.floor(num(F.counts[p.id]))), d = c - (p.stock || 0);
      let vend = 0; S.sales.forEach(s => (s.items || []).forEach(i => { if (i.pid === p.id) vend += i.qty; }));
      const upd = {stock: c, lastCheck: today(), adj: c - (initOf(p) - vend)}; if (d !== 0) adj++;
      await db.doc('products/' + p.id).update(upd);
    }
    closeSheet(); toast(adj ? `Estoque conferido. ${adj} ${adj > 1 ? 'ajustes feitos' : 'ajuste feito'}.` : 'Estoque conferido. Tudo bate.');
  });
}

function vClientes() {
  const m = {};
  S.sales.forEach(s => { const k = (s.customer || '').trim().toLowerCase(); (m[k] = m[k] || {name: s.customer, sales: [], owe: 0, total: 0}); const o = m[k]; o.sales.push(s); o.total += val(s); if (!s.paid) o.owe += s.total; });
  const list = Object.entries(m).map(([k, o]) => ({k, ...o})).sort((a, b) => b.owe - a.owe || a.name.localeCompare(b.name));
  if (!S.loaded.sales) return empty('Carregando clientes…');
  if (!list.length) return empty('Os clientes aparecem aqui assim que você lançar a primeira venda.');
  return `<section><p class="sub">Quanto cada cliente ainda deve e quanto já comprou.</p><div class="list">${list.map(o => {
    const open = !!S.open[o.k];
    const sales = o.sales.slice().sort((a, b) => (a.paid - b.paid) || (b.date || '').localeCompare(a.date || ''));
    return `<div class="cust"><button data-act="toggle-cust" data-id="${esc(o.k)}" aria-expanded="${open}"><div><div class="who">${esc(o.name)}</div><div class="muted">${o.sales.length} ${o.sales.length > 1 ? 'compras' : 'compra'} · ${brl(o.total)} no total</div></div>
      <div><div class="owe" style="color:${o.owe ? 'var(--warn)' : 'var(--ok)'}">${o.owe ? brl(o.owe) : 'Em dia'}</div>${o.owe ? '<div class="muted" style="text-align:right">a receber</div>' : ''}</div></button>
      ${open ? `<div class="in">${sales.map(s => saleCard(s, {hideName: true})).join('')}</div>` : ''}</div>`;

}

function movements() {
  const out = [];
  S.sales.filter(s => s.paid).forEach(s => out.push({date: s.paidDate || s.date, label: 'Venda · ' + s.customer, amt: val(s), id: 's' + s.id}));
  S.wallet.forEach(w => out.push({date: w.date, label: w.note || (w.type === 'entrada' ? 'Aporte' : w.kind === 'despesa' ? 'Despesa' : 'Retirada'), amt: w.type === 'entrada' ? w.amount : -w.amount, id: w.id, wid: w.id}));
  return out.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
}

/* ---------- painel ---------- */
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESF = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mlabel = k => MES[+k.slice(5, 7) - 1] + '/' + k.slice(2, 4);
const mfull = k => MESF[+k.slice(5, 7) - 1] + ' de ' + k.slice(0, 4);
const pf = x => (Math.round(x * 10) / 10).toLocaleString('pt-BR') + '%';

/* espelho do catálogo: só nome, marca, preço, foto e se tem estoque (nunca custo) */
let canEdit = false, syncing = false, again = false;
async function syncCatalog() {
  if (!db || !canEdit || !S.loaded.products || !S.loaded.catalog) return;
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    const cat = Object.fromEntries(S.catalog.map(c => [c.id, c]));
    for (const p of S.products) {
      const want = {n: p.n || 0, name: p.name || '', brand: p.brand || '', price: p.price || 0, img: p.img || '', avail: (p.stock || 0) > 0}, have = cat[p.id];
      if (!have || Object.keys(want).some(k => have[k] !== want[k])) await db.doc('catalog/' + p.id).set(want);
    }
    for (const c of S.catalog) if (c.id !== 'config' && !S.products.some(p => p.id === c.id)) await db.doc('catalog/' + c.id).delete();
  } catch (e) { console.error(e); }
  finally { syncing = false; if (again) { again = false; setTimeout(syncCatalog, 400); } }
}

/* ---------- sheet + toast ---------- */
function openSheet(html) { const sh = $('#sheet'); $('#sheet-body').innerHTML = html; sh.hidden = false; }
function closeSheet() { $('#sheet').hidden = true; $('#sheet-body').innerHTML = ''; F = null; }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); }
function armed(btn) {
  if (btn.dataset.armed === '1') return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = 'Toque de novo para confirmar'; btn.classList.add('danger');
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = btn.dataset.orig; btn.classList.remove('danger'); } }, 3500);
  return false;
}
async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { console.error(e); toast('Não foi possível salvar. Tente de novo.'); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
}
const head = (t) => `<div class="sheet-h"><h3>${t}</h3><button class="x-btn" data-act="close" aria-label="Fechar">×</button></div>`;

function openSale() { F = {kind: 'sale', customer: '', lines: [{pid: '', qty: 1, price: ''}], paid: false, due: addDays(today(), 30), paidDate: today(), received: '', note: ''}; renderSale(); }
async function saveSale(btn) {
  const err = m => { $('#err').textContent = m; };
  const customer = F.customer.trim(); if (!customer) return err('Informe o nome do cliente.');
  const items = [], need = {};
  for (const l of F.lines) {
    if (!l.pid && !num(l.price)) continue;
    const p = S.products.find(x => x.id === l.pid); if (!p) return err('Escolha o produto em cada linha.');
    const q = Math.floor(num(l.qty)), pr = num(l.price);
    if (q < 1) return err('A quantidade deve ser 1 ou mais.'); if (pr <= 0) return err('Informe o preço de venda de ' + p.name + '.');
    need[p.id] = (need[p.id] || 0) + q; items.push({pid: p.id, name: p.name, qty: q, cost: p.cost, price: r2(pr)});
  }
  if (!items.length) return err('Adicione pelo menos um produto.');
  for (const id in need) { const p = S.products.find(x => x.id === id); if (need[id] > (p.stock || 0)) return err(`Estoque insuficiente de ${p.name}: restam ${p.stock || 0}.`); }
  if (!F.paid && !F.due) return err('Informe até quando o cliente vai pagar.');
  const total = r2(items.reduce((a, i) => a + i.qty * i.price, 0)), costTotal = r2(items.reduce((a, i) => a + i.qty * i.cost, 0));
  await run(btn, async () => {
    await db.collection('sales').doc(uid('s')).set({customer, date: today(), items, total, costTotal, paid: F.paid, paidDate: F.paid ? F.paidDate : '', received: F.paid ? (F.received.trim() && num(F.received) > 0 ? r2(num(F.received)) : total) : null, dueDate: F.paid ? '' : F.due, note: F.note.trim()});
    for (const id in need) { const p = S.products.find(x => x.id === id); await db.doc('products/' + id).update({stock: (p.stock || 0) - need[id]}); }
    closeSheet(); toast('Venda salva.');
  });
}

async function saveProd(btn) {

  const cost = num(F.cost), price = num(F.price); if (price <= 0) return $('#err').textContent = 'Informe o preço de venda.';

  await run(btn, async () => {
    if (F.id) { const old = S.products.find(x => x.id === F.id) || {}, ni = Math.max(0, Math.floor(num(F.initial))); await db.doc('products/' + F.id).update({name, brand: F.brand.trim(), cost: r2(cost), price: r2(price), stock, initial: ni, spent: r2(Math.max(0, spentOf(old) + (ni - initOf(old)) * cost))}); }
    else await db.collection('products').doc(uid('p')).set({n: Date.now(), name, brand: F.brand.trim(), cost: r2(cost), price: r2(price), stock, initial: stock, spent: r2(cost * stock)});

    : `<label class="f">Valor (R$)<input data-f="amount" inputmode="decimal" value="${esc(F.amount)}" placeholder="0,00"></label><label class="f">Para quê (opcional)<input data-f="note" value="${esc(F.note)}" placeholder="${t === 'retirada' ? 'Ex.: pedido de novos produtos' : t === 'despesa' ? 'Ex.: frete, embalagem, taxa do Pix' : 'Ex.: dinheiro meu para o caixa'}"></label>${t === 'despesa' ? '<p class="muted" style="margin:0">Despesa entra no DRE do Painel e reduz o lucro líquido. Compra de produto não é despesa: vira estoque.</p>' : ''}`}
    <label class="f">Data<input data-f="date" type="date" value="${F.date}"></label>
    <div class="sum"><div><span>${t === 'aporte' ? 'Entra na carteira' : 'Sai da carteira'}</span><b id="wamt">${brl(amount)}</b></div><div><span>Saldo depois</span><b id="wafter" class="${(t === 'aporte' ? bal + amount : bal - amount) < 0 ? 'neg' : ''}">${brl(t === 'aporte' ? bal + amount : bal - amount)}</b></div></div>
    <div class="warn-t" id="wwarn">${t !== 'aporte' && bal - amount < 0 ? 'O saldo vai ficar negativo. Você ainda pode registrar.' : ''}</div>
    <div class="err-t" id="err" role="alert"></div>
    <button class="btn" data-act="save-wallet">${t === 'compra' ? 'Registrar compra' : t === 'retirada' ? 'Registrar retirada' : t === 'despesa' ? 'Registrar despesa' : 'Registrar aporte'}</button></div>`);
}
/* ---------- compra de produtos (custo médio) ---------- */
const NEWP = '__new';
function buyCalc() {
  const L = F.lines.map(l => ({qty: Math.max(0, Math.floor(num(l.qty))), unit: num(l.unit)}));
  const sub = L.reduce((a, l) => a + l.qty * l.unit, 0), fr = Math.max(0, num(F.freight)), run = {};
  const lines = F.lines.map((l, i) => {
    const q = L[i].qty, u = L[i].unit, eff = q > 0 ? u + (sub > 0 ? fr * (q * u / sub) / q : 0) : u;
    const key = l.pid === NEWP ? 'n' + i : l.pid, p = S.products.find(x => x.id === l.pid);
    if (key && run[key] == null) run[key] = {st: p ? p.stock || 0 : 0, cost: p ? num(p.cost) : 0, init: p ? initOf(p) : 0, spent: p ? spentOf(p) : 0, old: p ? num(p.cost) : null};
    const r = key ? run[key] : null; let avg = eff;
    if (r && q > 0) { avg = r.st > 0 ? (r.st * r.cost + q * eff) / (r.st + q) : eff; r.cost = avg; r.st += q; r.init += q; r.spent += q * eff; }
    return {q, u, eff, avg, old: r ? r.old : null, key, amount: q * eff};
  });
  return {lines, sub, fr, total: sub + fr, run};
}
function renderBuy() {
  const prods = S.products.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  const lines = F.lines.map((l, i) => `<div class="line">
    <select data-f="pid" data-i="${i}" aria-label="Produto"><option value="">Escolher produto</option><option value="${NEWP}" ${l.pid === NEWP ? 'selected' : ''}>➕ Produto novo (cadastrar agora)</option>${prods.map(x => `<option value="${x.id}" ${x.id === l.pid ? 'selected' : ''}>${esc(x.name)} · ${x.stock || 0} un · custo ${brl(x.cost)}</option>`).join('')}</select>
    ${l.pid && l.pid !== NEWP && !((S.products.find(x => x.id === l.pid) || {}).price > 0) ? `<label class="f">Preço de venda (R$) — ainda não definido<input data-f="price" data-i="${i}" inputmode="decimal" value="${esc(l.price)}" placeholder="0,00"></label>` : ''}
    ${l.pid === NEWP ? `<label class="f">Nome<input data-f="name" data-i="${i}" value="${esc(l.name)}" placeholder="Ex.: Gloss labial"></label><div class="grid2"><label class="f">Marca<input data-f="brand" data-i="${i}" value="${esc(l.brand)}" placeholder="Ex.: Melu"></label><label class="f">Preço de venda (R$)<input data-f="price" data-i="${i}" inputmode="decimal" value="${esc(l.price)}" placeholder="0,00"></label></div>` : ''}
    <div class="grid2"><label class="f">Quantidade<input data-f="qty" data-i="${i}" type="number" inputmode="numeric" min="1" value="${esc(l.qty)}"></label><label class="f">Preço de compra (un.)<input data-f="unit" data-i="${i}" inputmode="decimal" value="${esc(l.unit)}" placeholder="0,00"></label></div>
    <div class="row sb"><span class="muted" id="bl${i}"></span>${F.lines.length > 1 ? `<button class="btn ghost sm" data-act="rm-bline" data-id="${i}">Remover</button>` : ''}</div></div>`).join('');
  openSheet(`${head('Registrar compra')}<div class="form">
    ${lines}<button class="btn ghost" data-act="add-bline">+ Outro produto</button>
    <div class="grid2"><label class="f">Frete / extras (R$)<input data-f="freight" inputmode="decimal" value="${esc(F.freight)}" placeholder="0,00"></label><label class="f">Data<input data-f="date" type="date" value="${F.date}"></label></div>
    <p class="muted" style="margin:0">O custo médio vale só para as próximas vendas: vendas já feitas guardam o custo da época e o lucro delas não muda. Se o estoque estiver zerado, o custo passa a ser o da compra nova. O frete é dividido entre os produtos.</p>
    <div class="sum" id="bsum"></div><div class="warn-t" id="wwarn"></div>
    <div class="err-t" id="err" role="alert"></div>
    <button class="btn" data-act="save-buy">Registrar compra</button>
    <button class="btn ghost" data-act="other-wallet">Despesa, retirada ou aporte</button></div>`);
  updBuy();
}
function updBuy() {
  const c = buyCalc(), el = $('#bsum'); if (!el) return; const bal = calc().balance, after = bal - c.total;
  el.innerHTML = `<div><span>Total da compra</span><b>${brl(c.total)}</b></div><div><span>Saldo da carteira depois</span><b class="${after < 0 ? 'neg' : ''}">${brl(after)}</b></div>`;
  $('#wwarn').textContent = after < 0 ? 'O saldo vai ficar negativo. Você ainda pode registrar.' : '';
  c.lines.forEach((l, i) => { const n = $('#bl' + i); if (!n) return; const pr = F.lines[i];
    n.textContent = !pr.pid || l.q < 1 ? '' : pr.pid === NEWP ? `custo ${brl(l.avg)} por un.` : `custo médio: ${brl(l.old)} → ${brl(l.avg)}${l.eff !== l.u ? ` (já com frete: ${brl(l.eff)} por un.)` : ''}`; });
}
function openBuy() { F = {kind: 'buy', date: today(), freight: '', lines: [{pid: '', qty: '1', unit: '', name: '', brand: '', price: ''}]}; renderBuy(); }
async function saveBuy(btn) {
  const err = m => { $('#err').textContent = m; }, c = buyCalc();
  for (let i = 0; i < F.lines.length; i++) { const l = F.lines[i], n = i + 1;
    if (!l.pid) return err(`Produto ${n}: escolha o produto.`);
    if (l.pid && l.pid !== NEWP && !((S.products.find(x => x.id === l.pid) || {}).price > 0) && num(l.price) <= 0) return err(`Produto ${n}: informe o preço de venda.`);
    if (l.pid === NEWP) { if (!l.name.trim()) return err(`Produto ${n}: informe o nome.`); if (num(l.price) <= 0) return err(`Produto ${n}: informe o preço de venda.`); }
    if (c.lines[i].q < 1) return err(`Produto ${n}: informe a quantidade.`); if (c.lines[i].u <= 0) return err(`Produto ${n}: informe o preço de compra.`); }
  await run(btn, async () => {
    const done = {};
    for (let i = 0; i < F.lines.length; i++) { const l = F.lines[i], k = c.lines[i], key = k.key, r = c.run[key], when = F.date;
      let pid = l.pid;
      if (pid === NEWP) { pid = uid('p'); await db.collection('products').doc(pid).set({n: Date.now() + i, name: l.name.trim(), brand: l.brand.trim(), cost: r2(r.cost), price: r2(num(l.price)), stock: r.st, initial: r.init, spent: r2(r.spent)}); }
      else if (!done[key]) { const up = {stock: r.st, initial: r.init, cost: r2(r.cost), spent: r2(r.spent)}; if (num(l.price) > 0) up.price = r2(num(l.price)); await db.doc('products/' + pid).update(up); done[key] = 1; }
      const name = l.pid === NEWP ? l.name.trim() : (S.products.find(x => x.id === l.pid) || {}).name;
      await db.collection('wallet').doc(uid('w')).set({type: 'saida', kind: 'compra', amount: r2(k.amount), date: when, note: `Compra: ${k.q}× ${name}`, pid, qty: k.q});
    }
    closeSheet(); toast('Compra registrada, estoque e custo médio atualizados.');
  });
}
function updWallet() {
  const bal = calc().balance, t = F.type, amount = t === 'compra' ? Math.max(0, Math.floor(num(F.qty))) * num(F.unit) : num(F.amount), after = t === 'aporte' ? bal + amount : bal - amount;
  $('#wamt').textContent = brl(amount); const a = $('#wafter'); a.textContent = brl(after); a.className = after < 0 ? 'neg' : '';
  $('#wwarn').textContent = t !== 'aporte' && after < 0 ? 'O saldo vai ficar negativo. Você ainda pode registrar.' : '';
}
function openWallet() { F = {kind: 'wallet', type: 'despesa', pid: '', qty: '1', unit: '', amount: '', note: '', date: today()}; renderWallet(); }
async function saveWallet(btn) {
  const t = F.type, err = m => { $('#err').textContent = m; };
  if (t === 'compra') {
    const p = S.products.find(x => x.id === F.pid), q = Math.floor(num(F.qty)), u = num(F.unit);
    if (!p) return err('Escolha o produto comprado.'); if (q < 1) return err('Informe a quantidade.'); if (u <= 0) return err('Informe o custo por unidade.');
    const st = p.stock || 0, ns = st + q, avg = st > 0 ? (st * p.cost + q * u) / ns : u;
    await run(btn, async () => {
      await db.doc('products/' + p.id).update({stock: ns, initial: initOf(p) + q, cost: r2(avg)});
      await db.collection('wallet').doc(uid('w')).set({type: 'saida', kind: 'compra', amount: r2(q * u), date: F.date, note: `Compra: ${q}× ${p.name}`, pid: p.id, qty: q});
      closeSheet(); toast('Compra registrada e estoque atualizado.');
    });
  } else {
    const a = num(F.amount); if (a <= 0) return err('Informe o valor.');
    await run(btn, async () => { await db.collection('wallet').doc(uid('w')).set({type: t === 'aporte' ? 'entrada' : 'saida', kind: t, amount: r2(a), date: F.date, note: F.note.trim()}); closeSheet(); toast('Movimentação registrada.'); });
  }
}

  if (a === 'add-bline') { F.lines.push({pid: '', qty: '1', unit: '', name: '', brand: '', price: ''}); return renderBuy(); }

  if (a === 'save-buy') return saveBuy(b);
  if (a === 'add-line') { F.lines.push({pid: '', qty: 1, price: ''}); return renderSale(); }
  if (a === 'rm-line') { F.lines.splice(+id, 1); return renderSale(); }
  if (a === 'save-sale') return saveSale(b);
  if (a === 'save-esale') return saveEditSale(b);
  if (a === 'save-prod') return saveProd(b);
  if (a === 'save-wallet') return saveWallet(b);
  if (a === 'save-stock') return saveStock(b);
  if (a === 'save-cfg') return run(b, async () => { await db.doc('catalog/config').set({title: F.title.trim(), whatsapp: F.whatsapp.replace(/\D/g, '')}); closeSheet(); toast('Catálogo atualizado.'); });
  if (a === 'save-pay') return savePay(b);
  if (a === 'unpay') return run(b, () => { const s = S.sales.find(x => x.id === id); return db.doc('sales/' + id).update({paid: false, paidDate: '', received: null, dueDate: addDays(today(), 30)}); });
  if (a === 'del-sale') {
    if (!armed(b)) return;
    const s = S.sales.find(x => x.id === id); if (!s) return;
    return run(b, async () => {
      for (const i of s.items || []) { const p = S.products.find(x => x.id === i.pid); if (p) await db.doc('products/' + p.id).update({stock: (p.stock || 0) + i.qty}); }
      await db.doc('sales/' + id).delete(); closeSheet(); toast('Venda excluída e estoque devolvido.');
    });
  }
  if (a === 'del-prod') { if (!armed(b)) return; return run(b, async () => { await db.doc('products/' + F.id).delete(); closeSheet(); toast('Produto excluído.'); }); }
  if (a === 'del-wallet') { if (!armed(b)) return; return run(b, () => db.doc('wallet/' + id).delete()); }
});
const sheetEl = $('#sheet');
sheetEl.addEventListener('click', e => { if (e.target === sheetEl) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheetEl.hidden) closeSheet(); });

sheetEl.addEventListener('change', async e => {
  const t0 = e.target; if (t0.id === 'photo-in' && F && F.kind === 'sale' && SAMPLE && t0.files[0]) {

      const keep = F.lines.filter(l => l.pid); F.lines = keep.concat(r.lines); if (!F.lines.length) F.lines = [{pid: '', qty: 1, price: ''}];
      F.photo = r.url; F.unknown = r.unknown; if (!r.lines.length) toast('Não reconheci produtos do catálogo na foto.');
    } catch (err) { const c = err && err.code; if (c === 'not_granted' || c === 'images_unavailable') SAMPLE = null; toast(ERRPH[c] || 'Não consegui analisar a foto.'); }
    photoBusy = false; if (F === cur) renderSale(); return; }
  const t = e.target, f = t.dataset.f; if (!F || !f) return;
  if (F.kind === 'sale' && f === 'pid') { const l = F.lines[+t.dataset.i], p = S.products.find(x => x.id === t.value); l.pid = t.value; if (p) l.price = fld(p.price); l.check = false; return renderSale(); }
  if (F.kind === 'sale' && f === 'paid') { F.paid = t.value === '1'; return renderSale(); }
  if (F.kind === 'buy' && f === 'pid') { const l = F.lines[+t.dataset.i], p = S.products.find(x => x.id === t.value); l.pid = t.value; if (p && !l.unit) l.unit = fld(p.cost); return renderBuy(); }
  if (F.kind === 'wallet' && f === 'type') { if (t.value === 'compra') return openBuy(); F.type = t.value; return renderWallet(); }
  if (F.kind === 'wallet' && f === 'pid') { const p = S.products.find(x => x.id === t.value); F.pid = t.value; if (p) F.unit = fld(p.cost); return renderWallet(); }
});
$('#app').addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } if (e.target.id === 'cq') { S.cq = e.target.value; render(); } });
$('#app').addEventListener('change', e => {
  if (e.target.id === 'fb') { S.fb = e.target.value; const p = S.products.find(x => x.id === S.fp); if (p && S.fb && p.brand !== S.fb) S.fp = ''; render(); }
  if (e.target.id === 'fp') { S.fp = e.target.value; render(); }

window.addEventListener('hashchange', render);

/* ---------- data ---------- */
function sub(col) {
  db.collection(col).onSnapshot(snap => { S[col] = snap.docs.map(d => ({id: d.id, ...d.data()})); S.loaded[col] = true; render(); },
    e => { if (col === 'catalog') { S.loaded.catalog = true; render(); } else { S.err = e.code || 'err'; render(); } });
}

/* ---------- banco: Supabase (cada coleção é uma tabela id + data jsonb) ---------- */
function makeDb(sb) {
  const TB = {products: 'products', sales: 'sales', wallet: 'wallet', catalog: 'config'};
  const cache = {}, ls = {};
  const snap = c => ({docs: Object.entries(cache[c] || {}).map(([id, d]) => ({id, data: () => d}))});
  const emit = c => (ls[c] || []).forEach(f => f.next(snap(c)));
  async function load(c) {
    const r = await sb.from(TB[c]).select('id,data'); if (r.error) throw r.error;
    cache[c] = Object.fromEntries(r.data.map(x => [x.id, x.data])); emit(c);
  }
  function dref(c, id) {
    const ref = {
      async set(d) { const r = await sb.from(TB[c]).upsert({id, data: d, updated_at: new Date().toISOString()}); if (r.error) throw r.error; (cache[c] = cache[c] || {})[id] = d; emit(c); },
      async update(d) { const cur = (cache[c] || {})[id]; if (!cur) throw new Error('Registro não encontrado'); await ref.set(Object.assign({}, cur, d)); },
      async delete() { const r = await sb.from(TB[c]).delete().eq('id', id); if (r.error) throw r.error; if (cache[c]) delete cache[c][id]; emit(c); }
    };
    return ref;
  }
  return {
    collection: c => ({ onSnapshot(next, err) { (ls[c] = ls[c] || []).push({next}); load(c).catch(e => err && err({code: e.code || 'err'})); return () => {}; }, doc: id => dref(c, id) }),
    doc: p => { const k = p.split('/'); return dref(k[0], k[1]); },
    reload: () => Promise.all(Object.keys(ls).map(c => load(c).catch(() => {})))
  };
}

/* ---------- login ---------- */
const CFG = window.APP_CONFIG || {};
let sb = null;
function showLogin(msg) {
  document.body.classList.add('locked'); $('#login').hidden = false;
  if (msg) $('#login-err').textContent = msg;
}
function enter() {
  document.body.classList.remove('locked'); $('#login').hidden = true;
  db = makeDb(sb);
  ['products', 'sales', 'wallet', 'catalog'].forEach(sub);
  const again = () => { if (document.visibilityState === 'visible') db.reload(); };
  document.addEventListener('visibilitychange', again); setInterval(again, 60000);
}
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#login-btn'), err = $('#login-err'); err.textContent = ''; btn.disabled = true;
  try {
    const r = await sb.auth.signInWithPassword({email: $('#login-email').value.trim(), password: $('#login-pass').value});
    if (r.error) err.textContent = /invalid login/i.test(r.error.message || '') ? 'E-mail ou senha incorretos.' : 'Não entrou: ' + (r.error.message || r.error.code || 'erro') + (r.error.status ? ' (' + r.error.status + ')' : ''); else { $('#login-pass').value = ''; enter(); }
  } catch (x) { console.error(x); err.textContent = 'Não foi possível entrar agora. Detalhe técnico: ' + ((x && (x.message || x.name)) || String(x)); }
  btn.disabled = false;
});
render();
(async () => {
  if (!CFG.SUPABASE_URL || /SEU-PROJETO/.test(CFG.SUPABASE_URL) || !window.supabase) { showLogin('Falta preencher o arquivo config.js com os dados do seu Supabase.'); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && db) location.reload(); });
  let s = null; try { s = (await sb.auth.getSession()).data.session; } catch (e) {}
  if (s) enter(); else showLogin();
})();
})();
