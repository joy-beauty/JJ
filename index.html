<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo de Cosméticos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>


:root{
  --bg:#f6f4f7; --surface:#ffffff; --surface2:#efebf1; --fg:#26202b; --muted:#6d6475; --line:#e2dce7;
  --accent:#b3124f; --accent-fg:#ffffff; --accent-soft:#f8dde8; --mid:#a79cb0;
  --ok:#1c7a5a; --ok-soft:#d9f0e6; --warn:#9a5b00; --warn-soft:#fbebcf; --bad:#b42318; --bad-soft:#fbdcd8;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(38,32,43,.06),0 8px 24px rgba(38,32,43,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#19151c; --surface:#231e27; --surface2:#2d2732; --fg:#f1ecf4; --muted:#a79db0; --line:#3a3341;
  --accent:#f0699b; --accent-fg:#2a0a17; --accent-soft:#4a1b30; --mid:#7f748b;
  --ok:#5fd3a2; --ok-soft:#17382c; --warn:#f0b45a; --warn-soft:#3d2e12; --bad:#ff8a7d; --bad-soft:#45201c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#19151c; --surface:#231e27; --surface2:#2d2732; --fg:#f1ecf4; --muted:#a79db0; --line:#3a3341;
  --accent:#f0699b; --accent-fg:#2a0a17; --accent-soft:#4a1b30; --mid:#7f748b;
  --ok:#5fd3a2; --ok-soft:#17382c; --warn:#f0b45a; --warn-soft:#3d2e12; --bad:#ff8a7d; --bad-soft:#45201c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700;margin-bottom:2px}
.sub,.muted{color:var(--muted);font-size:13px}
.sub{margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip-bal{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;text-align:right;line-height:1.15}
.chip-bal span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip-bal b{font-size:16px}
section{margin-bottom:26px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .l{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.tile .n{font-size:12.5px;color:var(--muted)}
.tile.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tile.hot .l,.tile.hot .n{color:inherit;opacity:.85}
.tile.bad .v{color:var(--bad)} .tile.ok .v{color:var(--ok)}

.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);gap:2px;margin:14px 0 8px}
.bar i{display:block;min-width:4px}
.bar .a{background:var(--ok)} .bar .b{background:var(--warn)} .bar .c{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg)} .legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;text-decoration:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ln,.due{display:flex;align-items:baseline;gap:0;padding:3px 0}
.ln span,.due span{min-width:0;overflow-wrap:anywhere}
.lead{flex:1;border-bottom:2px dotted var(--line);margin:0 8px 4px;min-width:12px}
.list{display:grid;gap:10px}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;padding:11px 16px;min-height:44px}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}

.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:9px 12px}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{color:var(--fg);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:grid;gap:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.prod .im{aspect-ratio:1/1;width:100%;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-size:42px;color:var(--accent);overflow:hidden}
.prod .im img{width:100%;height:100%;object-fit:cover;display:block}
.prod .bd{padding:10px 12px 12px;display:grid;gap:4px}
.prod .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.prod .pr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.prod .pr b{color:var(--fg)}

.sale{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px}
.sale.ok{border-left-color:var(--ok)} .sale.warn{border-left-color:var(--warn)} .sale.bad{border-left-color:var(--bad)}
.sale-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.who{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.sale-f{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:8px}
.tot{font-family:var(--display);font-size:22px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.cust{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cust>button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;width:100%;cursor:pointer}
.cust>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cust .in{padding:0 12px 12px;display:grid;gap:10px}
.owe{font-family:var(--display);font-size:20px;font-weight:700;text-align:right}

.bal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.bal .big{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mv{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.mv:last-child{border-bottom:0}
.mv .d{width:48px;flex:none;color:var(--muted);font-size:13px}
.mv .t{flex:1;min-width:0;overflow-wrap:anywhere}
.mv .x{font-size:12px;color:var(--muted);background:none;border:0;padding:4px}
.pos{color:var(--ok);font-weight:600} .neg{color:var(--bad);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav button{background:none;border:0;border-radius:10px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:48px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow);border-radius:999px;padding:0 20px;min-height:50px;font-size:16px}

[hidden]{display:none!important}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(20,12,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h3{font-size:21px}
.x-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:20px;line-height:1}
.photo{display:grid;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px}.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px}.photo:has(img){grid-template-columns:auto 1fr}.photo label{grid-column:1/-1;text-align:center;cursor:pointer}.photo .dis{opacity:.6;pointer-events:none}.line.chk{border-color:#d9822b}.flag{font-size:12px;font-weight:600;color:#b45309}
.line{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.line .g{display:grid;grid-template-columns:90px 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg label{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg input:checked+span{display:block;background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15);border-radius:9px;margin:-9px -6px;padding:9px 6px}
.seg label{position:relative}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.sum{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum div{display:flex;justify-content:space-between}
.warn-t{color:var(--warn);font-size:13px}.err-t{color:var(--bad);font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}

nav .in{grid-template-columns:repeat(6,1fr)!important}
nav button{font-size:11px!important}
.share{display:grid;gap:10px;margin-bottom:14px}
.price{font-family:var(--display);font-size:20px;font-weight:700;color:var(--accent)}
.hero{margin-bottom:16px}.hero small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:32px;line-height:1.05;margin:2px 0 6px}.hero p{margin:0}
body.client nav,body.client .fab{display:none}
body.client{padding-block-end:32px}
.mplot{position:relative;height:222px;margin-top:6px}
.mplot .g{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);pointer-events:none}
.mplot .g span{position:absolute;left:0;top:-15px;background:var(--bg);padding-right:4px}
.mchart{position:absolute;inset:0;display:flex;gap:4px;overflow-x:auto}
.mcol{all:unset;box-sizing:border-box;flex:1 0 64px;display:flex;flex-direction:column;cursor:pointer;border-radius:10px;height:100%}
.mcol[aria-pressed="true"]{background:var(--surface2)}
.mcol:focus-visible{outline:2px solid var(--accent)}
.mcol .bars{height:160px;margin-top:12px;display:flex;align-items:flex-end;gap:3px;padding:0 8px}
.mcol .bars i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.bars .bv{background:var(--accent)}.bars .bc{background:var(--mid)}.bars .bl{background:var(--ok)}
.mcol .ml{text-align:center;font-size:12px;margin-top:6px;font-weight:600}
.mcol .mp{text-align:center;font-size:11px;color:var(--muted)}
.rk{display:grid;gap:12px}.rk .r{display:grid;gap:4px}
.rk .t{display:flex;justify-content:space-between;gap:10px}.rk .t>span:first-child{min-width:0;overflow-wrap:anywhere}
.rk .tr{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.rk .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.dn{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dw{position:relative;width:132px;height:132px;flex:none}.dw svg{width:100%;height:100%;display:block}
.dw>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ins li{padding-left:18px;position:relative}.ins li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.prog{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:6px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four span{padding:9px 2px;font-size:13px}
.dre .rw{display:grid;grid-template-columns:minmax(0,1fr) auto 74px;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.dre .rw>span:first-child{overflow-wrap:anywhere}
.dre .rw.h{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:0}
.dre .rw.st{font-weight:700;background:var(--surface2);margin:0 -14px;padding:9px 14px;border-bottom:0}
.dre .rw.in>span:first-child{padding-left:12px;color:var(--muted)}
.dre .rw>span:nth-child(2){text-align:right}
.dre .pp{text-align:right;color:var(--muted);font-size:13px;font-weight:500}
.dre .pp small{display:block;font-size:11px}
.dre .rw:last-child{border-bottom:0}
.tw{overflow-x:auto}
.mt{border-collapse:collapse;min-width:100%;font-size:13px}
.mt th,.mt td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.mt th:first-child,.mt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.mt tr.st td{font-weight:700}
.mt th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.mt tr.pcr td{color:var(--muted)}
.ln.hl>span:first-child,.ln.hl>b{font-weight:700;color:var(--accent)}
.sf-row{display:grid;grid-template-columns:44px minmax(0,1fr) 76px 40px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sf-im{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-family:var(--display);font-size:18px}
.sf-im img{width:100%;height:100%;object-fit:cover;display:block}
.sf-row .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.sf-row input{min-height:44px;text-align:center;padding:6px}
.sf-row .ok-b{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:44px;color:var(--ok);font-size:18px}
.sf-foot{position:sticky;bottom:0;background:var(--bg);margin:10px -16px 0;padding:12px 16px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
@media (min-width:700px){#sheet{align-items:center}.sheet{border-radius:20px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}

html,body{margin:0}
body.client{padding-block-end:32px}

</style>

<div class="wrap" id="app"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const IMGDIR = 'img/', CFG = window.APP_CONFIG || {};
let items = [], cfg = {}, q = '', brand = '', loaded = false, failed = false, sb = null;
function pimg(p) { const im = String(p.img || ''), src = /^https?:/.test(im) ? im : (im ? IMGDIR + im + '.jpg' : ''); return src ? `<img src="${src}" alt="" loading="lazy">` : esc((p.name || '?').trim().charAt(0).toUpperCase()); }
function render() {
  const brands = [...new Set(items.map(p => p.brand).filter(Boolean))].sort();
  const list = items.filter(p => (!brand || p.brand === brand) && (!q.trim() || (p.name + ' ' + (p.brand || '')).toLowerCase().includes(q.trim().toLowerCase())));
  const chip = (k, t) => `<button class="chip" data-brand="${esc(k)}" aria-pressed="${brand === k}">${esc(t)}</button>`;
  const title = cfg.title || 'Catálogo de Cosméticos'; document.title = title;
  $('#app').innerHTML = `<header class="hero"><small>${cfg.whatsapp ? 'Peça pelo WhatsApp' : 'Preços e produtos'}</small><h1>${esc(title)}</h1><p class="muted">Toque num produto para ver os detalhes.</p></header>
  <section><div class="tools"><input id="cq" type="search" placeholder="Buscar produto" value="${esc(q)}" aria-label="Buscar produto"></div>
  ${brands.length > 1 ? `<div class="chips">${chip('', 'Todos')}${brands.map(b => chip(b, b)).join('')}</div>` : ''}
  ${!loaded ? '<div class="empty">Carregando catálogo…</div>' : failed && !items.length ? '<div class="empty">Não foi possível carregar o catálogo agora. Tente de novo em instantes.<br><small style="opacity:.6">Detalhe técnico: ' + esc(errMsg) + '</small></div>' : list.length ? `<div class="cat">${list.map(p => `<button class="prod" data-id="${esc(p.id)}"><div class="im">${pimg(p)}</div><div class="bd"><div class="nm">${esc(p.name)}</div><div class="muted">${esc(p.brand || '')}</div><div class="price">${brl(p.price)}</div>${p.avail === false ? '<div><span class="pill bad">Esgotado</span></div>' : ''}</div></button>`).join('')}</div>` : '<div class="empty">Nenhum produto encontrado.</div>'}</section>`;
  const e = document.activeElement; if (e && e.id === 'cq') { /* mantém foco na busca */ }
}
function detail(id) {
  const p = items.find(x => x.id === id); if (!p) return;
  const d = String(cfg.whatsapp || '').replace(/\D/g, ''), n = d && d.length <= 11 ? '55' + d : d;
  const href = n ? `https://wa.me/${n}?text=${encodeURIComponent('Olá! Tenho interesse em: ' + p.name + ' (' + brl(p.price) + ')')}` : '';
  $('#sheet-body').innerHTML = `<div class="sheet-h"><h3>${esc(p.name)}</h3><button class="x-btn" data-close aria-label="Fechar">×</button></div><div class="form"><div class="prod" style="max-width:340px;margin:0 auto;width:100%"><div class="im">${pimg(p)}</div></div>
    <div><div class="muted">${esc(p.brand || '')}</div><div class="price" style="font-size:30px">${brl(p.price)}</div>${p.avail === false ? '<span class="pill bad">Esgotado</span>' : '<span class="pill ok">Disponível</span>'}</div>
    ${href ? `<a class="btn" style="text-align:center;text-decoration:none;display:grid;place-items:center" href="${href}" target="_blank" rel="noopener">Quero este pelo WhatsApp</a>` : ''}</div>`;
  $('#sheet').hidden = false;
}
const closeSheet = () => { $('#sheet').hidden = true; };
document.addEventListener('click', e => {
  const c = e.target.closest('[data-brand]'); if (c) { brand = c.dataset.brand; render(); return; }
  const p = e.target.closest('.prod[data-id]'); if (p) { detail(p.dataset.id); return; }
  if (e.target.closest('[data-close]') || e.target === $('#sheet')) closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#app').addEventListener('input', e => { if (e.target.id === 'cq') { q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#cq'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } });
let errMsg = '';
async function load() {
  try {
    const [a, b] = await Promise.all([sb.from('public_catalog').select('*').order('n'), sb.from('public_config').select('*')]);
    if (a.error) throw a.error; items = a.data || []; cfg = (b.data && b.data[0]) || {}; failed = false;
  } catch (e) { failed = true; errMsg = (e && (e.message || e.code)) || String(e); console.error(e); }
  loaded = true;
  const act = document.activeElement; if (act && act.id === 'cq') return; render();
}
render();
if (!CFG.SUPABASE_URL || /SEU-PROJETO/.test(CFG.SUPABASE_URL) || !window.supabase) { loaded = true; failed = true; errMsg = !window.supabase ? 'biblioteca supabase-js não carregou' : 'config.js não preenchido'; render(); }
else { sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); load(); setInterval(() => { if (document.visibilityState === 'visible') load(); }, 60000); }
})();
</script>
</body>
